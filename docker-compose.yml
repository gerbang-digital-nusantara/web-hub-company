services:
  web-hub-company:
    build: .
    container_name: web-hub-company-container
    ports:
      - "3110:3110"
    env_file:
      - .env
    # Permintaan demo disimpan di volume supaya tidak hilang saat container
    # dibuat ulang. Baca: docker compose exec web-hub-company cat /app/data/demo-requests.jsonl
    volumes:
      - ./data:/app/data
    restart: unless-stopped
