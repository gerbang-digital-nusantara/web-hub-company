# Pratinjau situs di GitHub Pages — HANYA folder view/ (statis).
#
# Server Go (main.go) TIDAK ikut: di Pages tidak ada /api/demo & /api/daftar,
# jadi config.js menyalakan mode pratinjau otomatis di *.github.io (form bisa
# dicoba tetapi tidak dikirim). Situs lengkap tetap lewat Docker di VPS.
#
# Sekali saja: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Pratinjau GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy sekaligus; deploy baru menunggu, tidak membatalkan yang berjalan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: view

      - id: deployment
        uses: actions/deploy-pages@v4
